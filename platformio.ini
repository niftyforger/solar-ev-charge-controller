; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = freenove_esp32_s3_wroom

[env]
platform = espressif32@6.10.0
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
; Regenerates include/secrets.h from OTA_PASSWORD in ".env" before every
; build (any env, any invocation path - CLI or the VSCode PlatformIO IDE
; buttons) - see tools/sync_secrets.py. This is a plain pre-build script,
; not a ${sysenv.*} substitution, so it isn't subject to the config-parse-
; time ordering issue described under [env:ota] below.
extra_scripts = pre:tools/sync_secrets.py
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
build_flags =
    -DCORE_DEBUG_LEVEL=3

; USB upload (default env; also the only path for the first flash on a blank board)
[env:freenove_esp32_s3_wroom]

; Wireless upload once the board is running and joined to WiFi.
; ArduinoOTA hostname is WIFI_HOSTNAME in include/config.h ("solar-ev-charger").
; The auth password must match the OTA_PASSWORD baked into the firmware,
; which tools/sync_secrets.py (see [env] above) generates from the same
; ".env" value - so it and the running firmware can never drift apart as
; long as both were built from the same .env.
;
; upload_port/upload_flags are deliberately NOT declared here - instead this
; relies entirely on PlatformIO's own built-in PLATFORMIO_UPLOAD_PORT/
; PLATFORMIO_UPLOAD_FLAGS environment variables, which every `pio`
; invocation reads automatically regardless of how it's launched
; (https://docs.platformio.org/en/latest/envvars.html). A gitignored ".env"
; can't populate those directly though (extra_scripts run in a child build
; process, so anything they set in os.environ never reaches the parent pio
; process that performs the actual upload step - tried and confirmed). Two
; ways to get them set:
;   - PlatformIO IDE's "Upload" button (VSCode toolbar, `ota` env selected):
;     run `python tools/sync_env_vars.py` once after filling in .env (copy
;     from .env.example) to persist them as Windows user environment
;     variables, then restart VSCode so it picks them up.
;   - CLI: `python tools/ota_upload.py`, which loads ".env" and sets both
;     vars in its own subprocess call to `pio run -e ota -t upload` - no
;     persistent/global env change, but only covers that invocation path.
; Or export them by hand for a one-off:
;   PowerShell:  $env:PLATFORMIO_UPLOAD_PORT = 'your-device-ip'; $env:PLATFORMIO_UPLOAD_FLAGS = '--auth=your-ota-password'; pio run -e ota -t upload
;   bash:        PLATFORMIO_UPLOAD_PORT=your-device-ip PLATFORMIO_UPLOAD_FLAGS=--auth=your-ota-password pio run -e ota -t upload
[env:ota]
upload_protocol = espota