; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = freenove_esp32_s3_wroom

[env]
platform = espressif32@6.10.0
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_flags =
    -DCORE_DEBUG_LEVEL=3

; USB upload (default env; also the only path for the first flash on a blank board)
[env:freenove_esp32_s3_wroom]

; Wireless upload once the board is running and joined to WiFi.
; ArduinoOTA hostname is WIFI_HOSTNAME in include/config.h ("geely-charger-controller").
; OTA_PASSWORD must match include/secrets.h; it is read from the OTA_PASSWORD
; shell env var here (not committed to this tracked file). Run e.g.:
;   PowerShell:  $env:OTA_PASSWORD = 'your-ota-password'; pio run -e ota -t upload
;   bash:        OTA_PASSWORD=your-ota-password pio run -e ota -t upload
[env:ota]
upload_protocol = espota
upload_port = 192.168.0.183
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}